<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>광고 소재 미리보기</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #0064FF;
      --dark: #111827;
      --gray: #6B7280;
      --light: #F8F9FA;
      --font: 'Noto Sans KR', -apple-system, sans-serif;
    }

    body {
      background: #1a1a2e;
      font-family: var(--font);
      color: white;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* ── 상단 컨트롤 ── */
    .page-header {
      max-width: 1100px;
      margin: 0 auto 40px;
    }
    .page-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .page-header p { font-size: 14px; color: #9ca3af; }

    .controls {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 20px 24px;
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .control-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9ca3af;
      margin-bottom: 5px;
    }

    .control-group input, .control-group select, .control-group textarea {
      width: 100%;
      padding: 8px 10px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: white;
      font-size: 13px;
      font-family: var(--font);
      outline: none;
    }
    .control-group textarea { resize: vertical; min-height: 56px; }
    .control-group select option { background: #1a1a2e; }

    .btn-update {
      grid-column: 1 / -1;
      padding: 10px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font);
    }
    .btn-update:hover { background: #0050cc; }

    /* ── 미리보기 그리드 ── */
    .preview-grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    /* ── 폰트 위계 강화 ── */
    .ad-headline { letter-spacing: -0.02em; }
    .ad-subtext  { font-weight: 400 !important; line-height: 1.65 !important; letter-spacing: -0.01em; }
    .ad-cta      { font-weight: 700 !important; letter-spacing: -0.01em; }

    /* ── 장식 요소 ── */
    .deco-dots {
      position: absolute; top: 5%; left: 6%;
      display: flex; gap: clamp(3px, 0.7vw, 6px);
      z-index: 3; pointer-events: none;
    }
    .deco-dot {
      width:  clamp(5px, 1.1vw, 9px);
      height: clamp(5px, 1.1vw, 9px);
      border-radius: 50%;
    }
    .deco-badge {
      position: absolute; top: 3%; right: 4%;
      width:  clamp(16px, 4.5vw, 42px);
      height: clamp(16px, 4.5vw, 42px);
      border-radius: 50%;
      z-index: 3; pointer-events: none;
    }

    /* ── 레이아웃 템플릿 ── */

    /* 숫자 강조형: 번호가 반투명 배경 요소로 */
    .layout-number .ad-number {
      font-size: clamp(70px, 16vw, 150px) !important;
      opacity: 0.15;
      line-height: 1;
    }
    .layout-number .ad-headline {
      font-size: clamp(13px, 2.6vw, 22px) !important;
      font-weight: 900 !important;
    }
    .layout-number .ad-subtext { margin-bottom: 4% !important; }

    /* 카드형: 하단 흰 카드에 카피, 배경에 헤드라인 */
    .layout-card {
      justify-content: flex-end !important;
      padding-bottom: 6% !important;
    }
    .layout-card .ad-visual { display: none !important; }
    .layout-card .ad-headline {
      font-size: clamp(12px, 2.2vw, 18px) !important;
      font-weight: 900 !important;
      text-shadow: 0 2px 8px rgba(0,0,0,0.35);
      margin-bottom: 6%;
    }
    .layout-card .ad-bottom {
      background: rgba(255,255,255,0.95) !important;
      border-radius: 14px;
      padding: 7% 8% !important;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.22);
    }
    .layout-card .ad-subtext {
      color: #374151 !important;
      margin-bottom: 6% !important;
    }
    .layout-card .ad-cta { background: #0064FF !important; color: white !important; }
    .layout-card .ad-brand { color: #0064FF !important; }

    .btn-save-png {
      width: 100%;
      margin-top: 8px;
      padding: 7px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      color: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font);
      transition: background 0.15s;
    }
    .btn-save-png:hover { background: rgba(255,255,255,0.2); }
    .btn-save-png:disabled { opacity: 0.5; cursor: not-allowed; }

    .preview-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .preview-label {
      font-size: 12px;
      font-weight: 700;
      color: #9ca3af;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── 광고 소재 공통 ── */
    .ad-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* 피드: 3:4 (1080×1440) */
    .ad-feed {
      width: 100%;
      aspect-ratio: 3 / 4;
    }

    /* 스토리: 9:16 */
    .ad-story {
      width: 100%;
      aspect-ratio: 9 / 16;
    }

    .ad-inner {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8% 7%;
      background: white;
      position: relative;
    }

    /* ── 헤드라인 영역 (상단) ── */
    .ad-headline-area {
      width: 100%;
      text-align: center;
      flex-shrink: 0;
    }

    .ad-headline {
      font-family: var(--font);
      font-weight: 900;
      color: var(--dark);
      line-height: 1.25;
      word-break: keep-all;
      white-space: pre-wrap;
    }

    /* ── 메인 비주얼 (중앙) ── */
    .ad-visual {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .ad-number {
      font-family: var(--font);
      font-weight: 900;
      color: var(--blue);
      line-height: 1;
      text-align: center;
    }

    /* ── 하단 영역 ── */
    .ad-bottom {
      width: 100%;
      text-align: center;
      flex-shrink: 0;
    }

    .ad-subtext {
      font-family: var(--font);
      font-weight: 400;
      color: var(--gray);
      line-height: 1.5;
      margin-bottom: 8%;
      white-space: pre-wrap;
    }

    .ad-cta {
      display: inline-block;
      background: var(--blue);
      color: white;
      font-family: var(--font);
      font-weight: 700;
      border-radius: 100px;
      text-align: center;
      width: 100%;
    }

    .ad-brand {
      font-family: var(--font);
      font-weight: 700;
      color: var(--blue);
      text-align: center;
      margin-top: 4%;
    }

    /* ── 스토리보드 선택 드롭다운 ── */
    #c-board-id { background: white !important; color: #111827 !important; }
    #c-board-id option { background: white; color: #111827; }

    /* ── 배경 이미지 레이어 ── */
    .ad-inner.has-bg { background-size: cover !important; background-position: center !important; }
    .ad-inner.has-bg > * { position: relative; z-index: 1; }
    .ad-inner.has-bg::before {
      content: ''; position: absolute; inset: 0; z-index: 0;
    }
    .ad-inner.overlay-dark::before {
      background: linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.1) 45%, rgba(0,0,0,0.55) 100%);
    }
    .ad-inner.overlay-light::before {
      background: linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0.45) 100%);
    }

    /* 인스타 UI 제거됨 */

    /* ── 다운로드 안내 ── */
    .download-hint {
      max-width: 1100px;
      margin: 24px auto 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 16px 20px;
      font-size: 13px;
      color: #9ca3af;
      line-height: 1.6;
    }
    .download-hint strong { color: white; }
  </style>
</head>
<body>

<div class="page-header">
  <h1>광고 소재 미리보기</h1>
  <p>스토리보드 설정값을 입력하면 피드/스토리 광고 시안을 실시간으로 확인할 수 있어요.</p>
  <div style="display:flex;gap:10px;margin-top:14px">
    <a href="/settings.html" style="padding:8px 16px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:white;font-size:13px;font-weight:700;text-decoration:none;font-family:var(--font)">⚙️ 스토리보드 설정</a>
    <a href="https://www.notion.so/5977952b7aeb4ddf800af0f1f15a6798" target="_blank" style="padding:8px 16px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:white;font-size:13px;font-weight:700;text-decoration:none;font-family:var(--font)">📋 Notion 아카이브</a>
  </div>

  <div class="controls">

    <div class="control-group" style="grid-column:1/-1">
      <label>스토리보드 불러오기</label>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="c-board-id" style="flex:1;background:white;border:1px solid rgba(255,255,255,0.3);border-radius:6px;color:#111827;padding:8px 10px;font-size:13px;font-family:var(--font);outline:none;" onchange="loadFromStoryboard(this.value)">
          <option value="">— 선택하세요 —</option>
        </select>
        <button onclick="pushToNotion()" id="btn-notion"
          style="padding:8px 14px;background:#5b21b6;color:white;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);white-space:nowrap">
          Notion 업데이트
        </button>
      </div>
      <div id="notion-status" style="font-size:11px;margin-top:5px;color:#9ca3af"></div>
    </div>

    <div class="control-group">
      <label>헤드라인 (엔터로 줄 바꿈)</label>
      <textarea id="c-headline" rows="2">두 번째 이직은, 94%가 맞아떨어진다</textarea>
    </div>
    <div class="control-group">
      <label>강조 숫자 / 키워드</label>
      <input type="text" id="c-number" value="94%">
    </div>
    <div class="control-group">
      <label>서브카피</label>
      <textarea id="c-subtext">커리어벗은 이력서가 아닌 성향으로 회사를 찾아줍니다. 컬처핏 매칭률 94%.</textarea>
    </div>
    <div class="control-group">
      <label>CTA 버튼</label>
      <input type="text" id="c-cta" value="1분 만에 시작하기">
    </div>
    <div class="control-group">
      <label>브랜드명</label>
      <input type="text" id="c-brand" value="CareerBut">
    </div>
    <div class="control-group">
      <label>강조 컬러</label>
      <input type="color" id="c-color" value="#0064FF">
    </div>
    <div class="control-group">
      <label>배경 (프리셋 또는 직접 선택)</label>
      <select id="c-bg-preset" onchange="syncBgColor(this.value)">
        <option value="#FFFFFF">순백 (미니멀 클린)</option>
        <option value="#F8F9FA">오프화이트</option>
        <option value="#F5F0EB">따뜻한 오피스</option>
        <option value="#111827">다크 네이비</option>
        <option value="#0A0A0A">블랙 (대비 강조)</option>
        <option value="#FFF9F0">크림</option>
        <option value="#F0F4FF">라이트 블루</option>
        <option value="custom">직접 선택 →</option>
      </select>
      <input type="color" id="c-bg" value="#FFFFFF" style="margin-top:6px;width:100%;height:36px;border-radius:6px;border:1px solid rgba(255,255,255,0.15);cursor:pointer;background:none;" oninput="document.getElementById('c-bg-preset').value='custom'">
    </div>
    <div class="control-group">
      <label>레이아웃 템플릿</label>
      <select id="c-layout" onchange="updateAds()">
        <option value="basic">기본형 — 텍스트 중앙 수직</option>
        <option value="number">숫자 강조형 — 배경에 숫자 워터마크</option>
        <option value="card">카드형 — 하단 카드 박스</option>
      </select>
    </div>

    <div class="control-group">
      <label>배경 스타일</label>
      <select id="c-bg-mode" onchange="onBgModeChange()">
        <option value="color">단색</option>
        <option value="css">CSS 비주얼</option>
        <option value="photo">Unsplash 사진</option>
      </select>
    </div>
    <div class="control-group" id="group-visual-key" style="display:none">
      <label>비주얼 키</label>
      <select id="c-visual-key" onchange="updateAds()">
        <option value="미니멀 클린">미니멀 클린 — 흰 배경, 은은한 블루</option>
        <option value="따뜻한 일상">따뜻한 일상 — 크림/베이지 멀티 글로우</option>
        <option value="대비 강조">대비 강조 — 다크 네이비 딥</option>
        <option value="블루 그라데이션">블루 그라데이션 — 인디고/바이올렛</option>
        <option value="에너지 힙">에너지 힙 — 핑크→퍼플 글로우</option>
        <option value="프로페셔널 클린">프로페셔널 클린 — 쿨 그레이</option>
        <option value="다크 프리미엄">다크 프리미엄 — 블랙+골드 톤</option>
        <option value="네온 팝">네온 팝 — 다크+형광 멀티 글로우</option>
        <option value="오로라">오로라 — 다크+초록/보라/핑크 발광</option>
        <option value="선셋">선셋 — 다크오렌지→골드</option>
      </select>
    </div>
    <div class="control-group" id="group-photo" style="display:none">
      <label>사진 키워드 (영어)</label>
      <input type="text" id="c-photo-keyword" placeholder="예: office career burnout" value="office career">
    </div>

    <div class="control-group">
      <label>폰트</label>
      <select id="c-font" onchange="applyFont()">
        <option value="pretendard">프리텐다드 (Pretendard)</option>
        <option value="noto">노토산스 KR (Noto Sans KR)</option>
      </select>
    </div>

    <div class="control-group">
      <label>장식 요소</label>
      <select id="c-deco" onchange="updateAds()">
        <option value="none">없음</option>
        <option value="dots" selected>컬러 닷 — 닷 3개 + 원형 배지</option>
        <option value="line">브랜드 라인 — 상단 굵은 바</option>
        <option value="blob">블롭 — 유기적 배경 도형</option>
        <option value="stripe">스트라이프 — 대각선 패턴</option>
        <option value="sparkle">스파클 — 별 요소</option>
        <option value="corner">코너 포인트 — 모서리 삼각형</option>
        <option value="grid">도트 그리드 — 규칙적 점 패턴</option>
        <option value="wave">물결 라인 — SVG 웨이브</option>
        <option value="frame">이너 프레임 — 내부 테두리</option>
        <option value="glow">엣지 글로우 — 가장자리 발광</option>
      </select>
    </div>
    <div class="control-group">
      <label style="display:flex;gap:7px;align-items:center;cursor:pointer">
        <input type="checkbox" id="c-auto-palette" onchange="updateAds()" style="width:auto;accent-color:var(--blue)">
        자동 팔레트 — 메인 컬러로 배경·텍스트 자동 조합
      </label>
    </div>

    <button class="btn-update" onclick="updateAds()">미리보기 업데이트</button>
  </div>
</div>

<!-- 미리보기 -->
<div class="preview-grid" id="preview-grid">

  <!-- 피드 A (텍스트 분리) -->
  <div class="preview-card">
    <div class="preview-label">피드 — 텍스트 분리</div>
    <div class="ad-wrap ad-feed" id="feed-a">
      <div class="ad-inner" id="feed-a-inner">
        <div class="ad-headline-area">
          <div class="ad-headline" id="feed-a-headline"></div>
        </div>
        <div class="ad-visual">
          <div class="ad-number" id="feed-a-number"></div>
        </div>
        <div class="ad-bottom">
          <div class="ad-brand" id="feed-a-brand"></div>
        </div>
      </div>
    </div>
    <button class="btn-save-png" onclick="saveAsPng('feed-a', '피드_텍스트분리')">PNG로 저장</button>
  </div>

  <!-- 피드 B (카피 포함) -->
  <div class="preview-card">
    <div class="preview-label">피드 — 카피 포함</div>
    <div class="ad-wrap ad-feed" id="feed-b">
      <div class="ad-inner" id="feed-b-inner">
        <div class="ad-headline-area">
          <div class="ad-headline" id="feed-b-headline"></div>
        </div>
        <div class="ad-visual">
          <div class="ad-number" id="feed-b-number"></div>
        </div>
        <div class="ad-bottom">
          <div class="ad-subtext" id="feed-b-subtext"></div>
          <div class="ad-cta" id="feed-b-cta"></div>
        </div>
      </div>
    </div>
    <button class="btn-save-png" onclick="saveAsPng('feed-b', '피드_카피포함')">PNG로 저장</button>
  </div>

  <!-- 스토리 A (텍스트 분리) -->
  <div class="preview-card">
    <div class="preview-label">스토리 — 텍스트 분리</div>
    <div class="ad-wrap ad-story" id="story-a">
      <div class="ad-inner" id="story-a-inner">
        <div class="ad-headline-area">
          <div class="ad-headline" id="story-a-headline"></div>
        </div>
        <div class="ad-visual">
          <div class="ad-number" id="story-a-number"></div>
        </div>
        <div class="ad-bottom">
          <div class="ad-brand" id="story-a-brand"></div>
        </div>
      </div>
    </div>
    <button class="btn-save-png" onclick="saveAsPng('story-a', '스토리_텍스트분리')">PNG로 저장</button>
  </div>

  <!-- 스토리 B (카피 포함) -->
  <div class="preview-card">
    <div class="preview-label">스토리 — 카피 포함</div>
    <div class="ad-wrap ad-story" id="story-b">
      <div class="ad-inner" id="story-b-inner">
        <div class="ad-headline-area">
          <div class="ad-headline" id="story-b-headline"></div>
        </div>
        <div class="ad-visual">

  단, Unsplash 사진 배경 모드는 외부 이미지 제한으로 저장이 안 될 수 있어요. 단색 또는 CSS 비주얼 모드에서 사용하세요.

<script>
  // ─── 폰트 적용 ──────────────────────────────────────────────────────────────
  function applyFont() {
    const val = document.getElementById('c-font').value;
    const fontFamily = val === 'pretendard'
      ? "'Pretendard Variable', 'Pretendard', -apple-system, sans-serif"
      : "'Noto Sans KR', -apple-system, sans-serif";
    document.documentElement.style.setProperty('--font', fontFamily);
    updateAds();
  }

  // ─── 컬러 팔레트 자동 생성 ────────────────────────────────────────────────────
  function generatePalette(hex) {
    if (!hex || !hex.startsWith('#') || hex.length < 7) return null;
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    const h = n => Math.min(255, Math.round(n)).toString(16).padStart(2,'0');
    // 배경: 메인 컬러를 매우 밝게 (88% white 혼합)
    const bg = `#${h(r+(255-r)*0.88)}${h(g+(255-g)*0.88)}${h(b+(255-b)*0.88)}`;
    // 텍스트: 메인 컬러를 매우 어둡게
    const text = `#${h(r*0.14)}${h(g*0.14)}${h(b*0.14)}`;
    // 서브: 텍스트보다 약간 연하게
    const tr = Math.round(r*0.14), tg = Math.round(g*0.14), tb = Math.round(b*0.14);
    const sub = `#${h(tr+(255-tr)*0.38)}${h(tg+(255-tg)*0.38)}${h(tb+(255-tb)*0.38)}`;
    return { bg, text, sub };
  }

  // ─── 장식 요소 ────────────────────────────────────────────────────────────────

    if (decoType === 'dots') {

        [c,1],[c,0.5],['#9ca3af',0.35]

      inner.appendChild(dots);
      // 원형 배지 (우상단)
      const badge = document.createElement('div');

      badge.style.cssText = `position:absolute;top:3%;right:4%;width:clamp(16px,4.5vw,42px);height:clamp(16px,4.5vw,42px);border-radius:50%;background:${c};opacity:0.12;z-index:3;pointer-events:none;`;
      inner.appendChild(badge);
    }

    if (decoType === 'line') {
      // 상단 굵은 컬러 바
      const top = document.createElement('div');
      top.className = 'deco-auto';
      top.style.cssText = `position:absolute;top:0;left:0;right:0;height:clamp(3px,0.9vw,8px);background:${c};z-index:3;pointer-events:none;border-radius:12px 12px 0 0;`;
      inner.appendChild(top);
      // 하단 얇은 라인
      const bot = document.createElement('div');
      bot.className = 'deco-auto';
      bot.style.cssText = `position:absolute;bottom:0;left:0;right:0;height:clamp(1.5px,0.4vw,3px);background:${c};opacity:0.35;z-index:3;pointer-events:none;`;

    }

    if (decoType === 'blob') {
      // 큰 블롭 우하단
      const svg1 = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg1.setAttribute('class','deco-auto');
      svg1.setAttribute('viewBox','0 0 200 200');
      svg1.style.cssText = 'position:absolute;bottom:-8%;right:-8%;width:50%;height:auto;opacity:0.13;z-index:0;pointer-events:none;';
      svg1.innerHTML = `<path fill="${c}" d="M44.5,-75.9C57,-67.8,66.3,-54.4,73.5,-39.9C80.7,-25.4,85.8,-9.7,84.5,5.5C83.2,20.7,75.5,35.3,65.6,47.7C55.7,60.1,43.5,70.3,29.5,76.9C15.5,83.5,-0.3,86.5,-15.8,83.8C-31.3,81.1,-46.4,72.7,-58.6,61C-70.8,49.3,-80,34.4,-83.4,18.1C-86.8,1.8,-84.3,-15.8,-77.5,-31.2C-70.7,-46.5,-59.5,-59.6,-46,-68.3C-32.5,-77,-16.3,-81.3,0.2,-81.6C16.7,-81.9,32,-84.1,44.5,-75.9Z" transform="translate(100 100)"/>`;
      inner.appendChild(svg1);
      // 작은 블롭 좌상단
      const svg2 = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg2.setAttribute('class','deco-auto');
      svg2.setAttribute('viewBox','0 0 200 200');
      svg2.style.cssText = 'position:absolute;top:-10%;left:-8%;width:30%;height:auto;opacity:0.08;z-index:0;pointer-events:none;';
      svg2.innerHTML = `<path fill="${c}" d="M39.3,-65.6C52,-59.1,63.9,-49.5,70.7,-37.2C77.4,-24.9,79,-9.9,76.9,4.3C74.8,18.5,68.9,31.9,60.5,43.8C52,55.7,40.9,66.1,27.8,72.2C14.7,78.3,-0.4,80.2,-15.3,77.5C-30.2,74.8,-44.8,67.5,-55.3,56.6C-65.8,45.7,-72.2,31.2,-75.2,15.9C-78.2,0.6,-77.8,-15.5,-72.4,-29.5C-67,-43.5,-56.6,-55.4,-44.1,-62C-31.6,-68.7,-17,-70.2,-2.1,-67.4C12.8,-64.6,26.6,-72.1,39.3,-65.6Z" transform="translate(100 100)"/>`;
      inner.appendChild(svg2);
    }

    if (decoType === 'stripe') {
      const stripe = document.createElement('div');
      stripe.className = 'deco-auto';
      stripe.style.cssText = `position:absolute;inset:0;background:repeating-linear-gradient(45deg,${c}10 0px,${c}10 2px,transparent 2px,transparent 14px);z-index:0;pointer-events:none;border-radius:inherit;`;
      inner.appendChild(stripe);
    }

    if (decoType === 'sparkle') {
      const starPath = 'M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z';
      [['top:7%;left:7%;',14],['top:10%;right:9%;',10],['bottom:22%;left:5%;',8],['bottom:8%;right:7%;',16],['top:38%;right:4%;',9]].forEach(([pos,sz]) => {
        const w = document.createElement('div');
        w.className = 'deco-auto';
        w.style.cssText = `position:absolute;${pos}z-index:3;pointer-events:none;opacity:0.22;`;
        w.innerHTML = `<svg width="clamp(${sz/2}px,${sz*0.12}vw,${sz}px)" height="clamp(${sz/2}px,${sz*0.12}vw,${sz}px)" viewBox="0 0 24 24" fill="${c}"><path d="${starPath}"/></svg>`;
        inner.appendChild(w);
      });
    }

    if (decoType === 'corner') {
      // 좌상단 삼각형
      const tl = document.createElement('div');
      tl.className = 'deco-auto';
      tl.style.cssText = `position:absolute;top:0;left:0;width:0;height:0;border-top:clamp(20px,6vw,55px) solid ${c};border-right:clamp(20px,6vw,55px) solid transparent;opacity:0.7;z-index:3;pointer-events:none;`;
      inner.appendChild(tl);
      // 우하단 삼각형
      const br = document.createElement('div');
      br.className = 'deco-auto';
      br.style.cssText = `position:absolute;bottom:0;right:0;width:0;height:0;border-bottom:clamp(15px,4vw,38px) solid ${c};border-left:clamp(15px,4vw,38px) solid transparent;opacity:0.4;z-index:3;pointer-events:none;`;
      inner.appendChild(br);
    }

    if (decoType === 'grid') {
      const g = document.createElement('div');
      g.className = 'deco-auto';
      g.style.cssText = `position:absolute;inset:0;background-image:radial-gradient(circle,${c}22 1px,transparent 1px);background-size:clamp(10px,2.5vw,22px) clamp(10px,2.5vw,22px);z-index:0;pointer-events:none;border-radius:inherit;`;
      inner.appendChild(g);
    }

    if (decoType === 'wave') {
      const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('class','deco-auto');
      svg.setAttribute('viewBox','0 0 400 60');
      svg.setAttribute('preserveAspectRatio','none');
      svg.style.cssText = `position:absolute;bottom:15%;left:0;right:0;width:100%;height:auto;opacity:0.2;z-index:1;pointer-events:none;`;
      svg.innerHTML = `<path d="M0,30 C50,0 100,60 150,30 C200,0 250,60 300,30 C350,0 400,60 400,30" fill="none" stroke="${c}" stroke-width="3"/>
                       <path d="M0,42 C50,12 100,72 150,42 C200,12 250,72 300,42 C350,12 400,72 400,42" fill="none" stroke="${c}" stroke-width="1.5" opacity="0.5"/>`;
      inner.appendChild(svg);
    }

    if (decoType === 'frame') {
      const f = document.createElement('div');
      f.className = 'deco-auto';
      f.style.cssText = `position:absolute;inset:clamp(4px,1.2vw,10px);border:clamp(1.5px,0.4vw,3px) solid ${c};border-radius:8px;opacity:0.3;z-index:3;pointer-events:none;`;
      inner.appendChild(f);
      // 안쪽 작은 프레임
      const f2 = document.createElement('div');
      f2.className = 'deco-auto';
      f2.style.cssText = `position:absolute;inset:clamp(7px,2vw,16px);border:clamp(0.5px,0.2vw,1.5px) solid ${c};border-radius:6px;opacity:0.15;z-index:3;pointer-events:none;`;
      inner.appendChild(f2);
    }

    if (decoType === 'glow') {
      const g = document.createElement('div');
      g.className = 'deco-auto';
      g.style.cssText = `position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 40%,${c}28 70%,${c}45 100%);z-index:1;pointer-events:none;border-radius:inherit;`;
      inner.appendChild(g);
    }
  }

  // ─── 비주얼 키별 CSS 스타일 ───────────────────────────────────────────────────
  const VISUAL_STYLES = {
    '미니멀 클린': {
      bg: `radial-gradient(ellipse at 75% 15%, #dbeafe50 0%, transparent 55%),
           linear-gradient(150deg, #ffffff 0%, #f8faff 55%, #f0f4ff 100%)`,
      overlay: 'light', textColor: '#111827', subColor: '#6B7280',

    },
    '대비 강조': {

    },
    '블루 그라데이션': {
      bg: `radial-gradient(ellipse at 20% 80%, #bfdbfe40 0%, transparent 50%),
           radial-gradient(ellipse at 80% 10%, #6366f140 0%, transparent 50%),
           linear-gradient(135deg, #1e3a8a 0%, #3730a3 40%, #4f46e5 75%, #818cf8 100%)`,
      overlay: 'dark', textColor: '#ffffff', subColor: '#c7d2fe',
    },
    '에너지 힙': {
      bg: `radial-gradient(ellipse at 80% 20%, #f472b640 0%, transparent 50%),
           radial-gradient(ellipse at 20% 80%, #a855f740 0%, transparent 50%),
           linear-gradient(135deg, #db2777 0%, #9333ea 45%, #7c3aed 80%, #4f46e5 100%)`,
      overlay: 'dark', textColor: '#ffffff', subColor: '#f9a8d4',
    },
    '프로페셔널 클린': {
      bg: `radial-gradient(ellipse at 80% 20%, #e2e8f050 0%, transparent 55%),
           linear-gradient(150deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%)`,
      overlay: 'light', textColor: '#0f172a', subColor: '#475569',
    },
    '다크 프리미엄': {

           radial-gradient(ellipse at 25% 80%, #92400e18 0%, transparent 50%),
           linear-gradient(155deg, #0c0a09 0%, #1c1917 50%, #0c0a09 100%)`,
      overlay: 'dark', textColor: '#fef3c7', subColor: '#d6d3d1',

    '네온 팝': {

    },

      bg: `radial-gradient(ellipse at 50% 0%, #34d39930 0%, transparent 55%),

           radial-gradient(ellipse at 15% 80%, #f472b630 0%, transparent 50%),
           linear-gradient(160deg, #0f172a 0%, #1e1b4b 40%, #0f172a 100%)`,

    },
    '선셋': {
      bg: `radial-gradient(ellipse at 50% 0%, #fde68a50 0%, transparent 55%),
           radial-gradient(ellipse at 80% 60%, #fb923c40 0%, transparent 50%),
           linear-gradient(155deg, #7c2d12 0%, #c2410c 35%, #ea580c 65%, #fbbf24 100%)`,
      overlay: 'dark', textColor: '#ffffff', subColor: '#fed7aa',
    },
  };

  function isDarkHex(hex) {
    if (!hex || !hex.startsWith('#')) return false;
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return (r * 299 + g * 587 + b * 114) / 1000 < 128;
  }

  function getTextColors(mode, visualKey, bg) {
    if (mode === 'photo') return { text: '#ffffff', sub: '#e5e7eb' };
    if (mode === 'css') {
      const s = VISUAL_STYLES[visualKey] || VISUAL_STYLES['미니멀 클린'];
      return { text: s.textColor, sub: s.subColor };
    }
    const dark = isDarkHex(bg);
    return { text: dark ? '#ffffff' : '#111827', sub: dark ? '#9ca3af' : '#6B7280' };
  }

  function applyBackground(prefix, mode, visualKey, keyword, color) {
    const inner = document.getElementById(`${prefix}-inner`);
    if (!inner) return;
    inner.classList.remove('has-bg', 'overlay-dark', 'overlay-light');

    if (mode === 'color') {
      inner.style.background = color;
      inner.style.backgroundImage = 'none';
    } else if (mode === 'css') {
      const s = VISUAL_STYLES[visualKey] || VISUAL_STYLES['미니멀 클린'];
      inner.style.background = s.bg;
      inner.style.backgroundImage = 'none';
      inner.classList.add('has-bg', s.overlay === 'dark' ? 'overlay-dark' : 'overlay-light');
    } else if (mode === 'photo') {
      const url = `https://source.unsplash.com/featured/1080x1080/?${encodeURIComponent(keyword || 'office career')}`;
      inner.style.backgroundImage = `url(${url})`;
      inner.style.backgroundSize = 'cover';
      inner.style.backgroundPosition = 'center';
      inner.classList.add('has-bg', 'overlay-dark');
    }
  }

  function onBgModeChange() {
    const mode = document.getElementById('c-bg-mode').value;
    document.getElementById('group-visual-key').style.display = mode === 'css'   ? '' : 'none';
    document.getElementById('group-photo').style.display      = mode === 'photo' ? '' : 'none';
    updateAds();
  }

  function syncBgColor(val) {
    if (val !== 'custom') {
      document.getElementById('c-bg').value = val;
    }
  }

  function updateAds() {
    const headline   = document.getElementById('c-headline').value;
    const number     = document.getElementById('c-number').value;
    const subtext    = document.getElementById('c-subtext').value;
    const cta        = document.getElementById('c-cta').value;
    const brand      = document.getElementById('c-brand').value;
    const color      = document.getElementById('c-color').value;
    const bg         = document.getElementById('c-bg').value;
    const bgMode      = document.getElementById('c-bg-mode').value;
    const visualKey   = document.getElementById('c-visual-key').value;
    const photoKw     = document.getElementById('c-photo-keyword').value;
    const layout      = document.getElementById('c-layout').value;
    const autoPalette = document.getElementById('c-auto-palette').checked;
    const decoType    = document.getElementById('c-deco').value;

    // 자동 팔레트: 메인 컬러 기반으로 배경·텍스트 자동 생성
    let effectiveBg = bg;
    let { text: textColor, sub: subColor } = getTextColors(bgMode, visualKey, bg);

    if (autoPalette && bgMode === 'color' && color && color.startsWith('#')) {
      const palette = generatePalette(color);
      if (palette) {
        effectiveBg   = palette.bg;
        textColor     = palette.text;
        subColor      = palette.sub;
      }
    }

    // 피드 크기 기준으로 폰트 계산 (피드 너비 ≈ 컨테이너 1/4)
    const feedSizes  = { headline: 'clamp(12px, 2vw, 18px)', number: 'clamp(40px, 8vw, 72px)', sub: 'clamp(9px, 1.4vw, 13px)', cta: 'clamp(10px, 1.5vw, 14px)', brand: 'clamp(9px, 1.2vw, 12px)', avatar: 'clamp(14px,2vw,20px)', ui: 'clamp(8px,1.2vw,11px)' };
    const storySizes = { headline: 'clamp(10px, 1.6vw, 15px)', number: 'clamp(32px, 6vw, 56px)', sub: 'clamp(8px, 1.1vw, 11px)', cta: 'clamp(9px, 1.2vw, 12px)', brand: 'clamp(8px, 1vw, 10px)', avatar: 'clamp(12px,1.6vw,16px)', ui: 'clamp(7px,1vw,10px)' };

    const ads = [
      { prefix: 'feed-a',  sizes: feedSizes,  showSub: false, showCta: false },
      { prefix: 'feed-b',  sizes: feedSizes,  showSub: true,  showCta: true  },
      { prefix: 'story-a', sizes: storySizes, showSub: false, showCta: false },
      { prefix: 'story-b', sizes: storySizes, showSub: true,  showCta: true  },
    ];

    ads.forEach(({ prefix, sizes, showSub, showCta }) => {
      applyBackground(prefix, bgMode, visualKey, photoKw, effectiveBg);
      updateDecoration(prefix, color, decoType);

      // 레이아웃 클래스 적용
      const inner = document.getElementById(`${prefix}-inner`);
      if (inner) {
        inner.classList.remove('layout-basic', 'layout-number', 'layout-card');
        inner.classList.add(`layout-${layout}`);
      }

      const hl = document.getElementById(`${prefix}-headline`);
      if (hl) {
        hl.textContent = headline;
        hl.style.fontSize = sizes.headline;
        hl.style.color = textColor;
      }

      const num = document.getElementById(`${prefix}-number`);
      if (num) {
        num.textContent = number;
        num.style.fontSize = sizes.number;
        num.style.color = color;
      }

      const sub = document.getElementById(`${prefix}-subtext`);
      if (sub) {
        sub.textContent = subtext;
        sub.style.fontSize = sizes.sub;
        sub.style.color = subColor;
        sub.style.display = showSub ? '' : 'none';
      }

      const ctaEl = document.getElementById(`${prefix}-cta`);
      if (ctaEl) {
        ctaEl.textContent = cta;
        ctaEl.style.fontSize = sizes.cta;
        ctaEl.style.background = color;
        ctaEl.style.padding = `${parseFloat(sizes.cta) * 0.7}px ${parseFloat(sizes.cta) * 1.2}px`;
        ctaEl.style.display = showCta ? '' : 'none';
      }

      const brandEl = document.getElementById(`${prefix}-brand`);
      if (brandEl) {
        brandEl.textContent = brand;
        brandEl.style.fontSize = sizes.brand;
        brandEl.style.color = color;
        brandEl.style.display = showCta ? 'none' : '';
      }

      // 인스타 UI 제거됨
    });
  }

  // ─── 스토리보드 목록 로드 ───────────────────────────────────────────────────
  async function loadBoardList() {
    const sel = document.getElementById('c-board-id');
    if (!sel) { console.error('c-board-id 요소 없음'); return; }
    try {
      const res = await fetch('/api/storyboards');
      if (!res.ok) throw new Error('API 오류: ' + res.status);
      const boards = await res.json();
      console.log('스토리보드 목록:', boards);
      if (!boards.length) {
        sel.innerHTML = '<option value="">저장된 스토리보드 없음</option>';
        return;
      }
      sel.innerHTML = '<option value="">— 선택하세요 —</option>' +
        boards.map(b => `<option value="${b.id}">${b.id}</option>`).join('');
    } catch(e) {
      console.error('loadBoardList 오류:', e);
      sel.innerHTML = '<option value="">서버 연결 실패 (npm start 확인)</option>';
    }
  }

  // ─── Notion 반영 ────────────────────────────────────────────────────────────
  async function pushToNotion() {
    const boardId = document.getElementById('c-board-id').value;
    const status  = document.getElementById('notion-status');
    const btn     = document.getElementById('btn-notion');

    if (!boardId) {
      status.textContent = '⚠️ 스토리보드를 선택해주세요';
      status.style.color = '#f59e0b';
      return;
    }

    btn.textContent = '전송 중...';
    btn.disabled = true;
    status.textContent = '';

    try {
      const res = await fetch('/api/update-storyboard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          boardId,
          headline: document.getElementById('c-headline').value,
          subtext:  document.getElementById('c-subtext').value,
          cta:      document.getElementById('c-cta').value,
          color:    document.getElementById('c-color').value,
          bg:       document.getElementById('c-bg').value,
        }),
      });
      const result = await res.json();
      if (result.success && !result.warning) {
        status.textContent = '✅ 로컬 파일 + Notion 스토리보드 업데이트 완료!';
        status.style.color = '#34d399';
      } else if (result.success && result.warning) {
        status.textContent = `⚠️ ${result.warning}`;
        status.style.color = '#f59e0b';
      } else {
        status.textContent = `❌ ${result.error}`;
        status.style.color = '#f87171';
      }
    } catch (err) {
      status.textContent = '❌ 서버에 연결할 수 없어요. npm start를 실행해주세요.';
      status.style.color = '#f87171';
    } finally {
      btn.textContent = 'Notion에 반영';
      btn.disabled = false;
    }
  }

  // ─── 스토리보드 불러오기 ──────────────────────────────────────────────────────
  async function loadFromStoryboard(boardId) {
    if (!boardId) return;

    const status = document.getElementById('notion-status');
    status.textContent = '불러오는 중...';
    status.style.color = '#9ca3af';

    try {
      const res = await fetch(`/api/storyboard-preview/${boardId}`);
      if (!res.ok) throw new Error('불러오기 실패');
      const data = await res.json();

      if (data.headline) document.getElementById('c-headline').value = data.headline;
      if (data.subtext)  document.getElementById('c-subtext').value  = data.subtext;
      if (data.cta)      document.getElementById('c-cta').value      = data.cta;
      if (data.color)    document.getElementById('c-color').value    = data.color;
      if (data.bg) {
        document.getElementById('c-bg').value = data.bg;
        document.getElementById('c-bg-preset').value = 'custom';
      }

      updateAds();
      status.textContent = `✅ ${boardId} 불러오기 완료`;
      status.style.color = '#34d399';
    } catch (err) {
      status.textContent = '❌ ' + err.message;
      status.style.color = '#f87171';
    }
  }

  // ─── PNG 저장 ──────────────────────────────────────────────────────────────
  async function saveAsPng(adId, label) {
    const el = document.getElementById(adId);
    if (!el) return;
    const btn = el.closest('.preview-card')?.querySelector('.btn-save-png');
    if (btn) { btn.textContent = '저장 중...'; btn.disabled = true; }

    try {
      const canvas = await html2canvas(el, {
        scale: 2,
        useCORS: true,
        allowTaint: false,
        backgroundColor: null,
        logging: false,
      });
      const boardId = document.getElementById('c-board-id').value || 'ad';
      const filename = `${boardId}_${label}.png`;
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
      if (btn) { btn.textContent = '✅ 저장됨'; setTimeout(() => { btn.textContent = 'PNG로 저장'; btn.disabled = false; }, 2000); }
    } catch(e) {
      console.error('PNG 저장 오류:', e);
      if (btn) { btn.textContent = '저장 실패'; btn.disabled = false; }
    }
  }

  // 초기 렌더
  try { updateAds(); } catch(e) { console.error('updateAds 오류:', e); }
  loadBoardList();
</script>
</body>
</html>
